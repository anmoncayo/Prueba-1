<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación: Present Simple & Daily Routine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f5f7fc 0%, #e6ecf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .evaluation-card {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 25px 50px -8px rgba(0, 20, 40, 0.25), 0 8px 20px rgba(0,0,0,0.06);
            padding: 2.5rem 2.8rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.25rem;
            border-bottom: 3px solid #4a7cf7;
            padding-bottom: 18px;
        }
        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -5px;
            margin-bottom: 28px;
            color: #2c3e5c;
            font-weight: 500;
            font-size: 1rem;
            background: #f0f4fe;
            padding: 8px 18px;
            border-radius: 60px;
            width: fit-content;
        }
        .subhead span {
            background: #4a7cf7;
            color: white;
            padding: 0 16px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            line-height: 28px;
        }
        .question {
            background: #f9faff;
            border-radius: 28px;
            padding: 1.3rem 1.8rem;
            margin-bottom: 1.25rem;
            border: 1px solid #eef2f9;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .question:hover {
            border-color: #b6caf9;
            background: #fcfdff;
        }
        .q-title {
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #142b44;
            margin-bottom: 14px;
        }
        .q-number {
            background: #4a7cf7;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px 8px 8px;
            border-radius: 40px;
            transition: 0.15s;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
        }
        .option:hover {
            background: #eef3fe;
            border-color: #d1dffb;
        }
        .option input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #b2c6e6;
            border-radius: 50%;
            margin: 0;
            flex-shrink: 0;
            position: relative;
            transition: 0.15s;
            background: white;
        }
        .option input[type="radio"]:checked {
            border-color: #4a7cf7;
            background: #4a7cf7;
            box-shadow: inset 0 0 0 4px white, 0 0 0 1px #4a7cf7;
        }
        .option label {
            font-size: 1rem;
            color: #1f334c;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            padding: 4px 0;
        }
        .feedback {
            margin-top: 10px;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
            background: #eef2f9;
            color: #1f3a5f;
        }
        .correct-feedback {
            background: #d7f0df;
            color: #0b4b2a;
        }
        .incorrect-feedback {
            background: #ffe3e3;
            color: #a13131;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 18px;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .btn {
            background: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1f3a5f;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
            border: 1px solid #d6e0f0;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: #1f3a5f;
            color: white;
            border: 1px solid #1f3a5f;
            box-shadow: 0 8px 16px -6px rgba(26, 67, 113, 0.2);
        }
        .btn-primary:hover {
            background: #2b4b7a;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: #f0f4fe;
            border-color: #c8d8f5;
        }
        .btn-secondary:hover {
            background: #e3eafc;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .score-box {
            background: #142b44;
            color: white;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .score-box span {
            font-weight: 400;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-right: 8px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #4b6382;
            text-align: right;
            border-top: 1px solid #e2eaf5;
            padding-top: 18px;
            opacity: 0.7;
        }
        @media (max-width: 650px) {
            .evaluation-card {
                padding: 1.8rem 1.2rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .question {
                padding: 1rem 1.2rem;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                justify-content: center;
            }
            .score-box {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="evaluation-card" role="main">
        <h1>⏰ Daily Routine · Present Simple</h1>
        <div class="subhead">
            <span>📘 10 preguntas · gramática + vocabulario</span>
        </div>

        <!-- Aquí se inyectarán las preguntas con JS -->
        <div id="questionsContainer"></div>

        <div class="action-bar">
            <div class="btn-group">
                <button class="btn btn-primary" id="checkBtn">✅ Verificar respuestas</button>
                <button class="btn btn-secondary" id="resetBtn">🔄 Reiniciar</button>
            </div>
            <div class="score-box" id="scoreDisplay">
                <span>🏆</span> 0 / 10
            </div>
        </div>
        <div class="footer-note">Present simple · daily routines · 3rd person -s · adverbs of frequency</div>
    </div>

    <script>
        (function() {
            // ----- Definición de preguntas -----
            const questions = [
                {
                    id: 1,
                    stem: "My sister ______ breakfast at 7:30 every morning.",
                    options: ["have", "has", "is having", "have got"],
                    correct: 1, // index 0-based
                },
                {
                    id: 2,
                    stem: "We ______ to school by bus on weekdays.",
                    options: ["go", "goes", "are going", "going"],
                    correct: 0,
                },
                {
                    id: 3,
                    stem: "Choose the correct sentence about a daily routine:",
                    options: [
                        "He brush his teeth after dinner.",
                        "He brushes his teeth after dinner.",
                        "He brushs his teeth after dinner.",
                        "He brushing his teeth after dinner."
                    ],
                    correct: 1,
                },
                {
                    id: 4,
                    stem: "My father ______ coffee in the afternoon; he prefers tea.",
                    options: ["don't drink", "doesn't drink", "not drink", "isn't drink"],
                    correct: 1,
                },
                {
                    id: 5,
                    stem: "What time ______ your English class ______ ?",
                    options: [
                        "does / start", 
                        "do / start", 
                        "does / starts", 
                        "do / starts"
                    ],
                    correct: 0,
                },
                {
                    id: 6,
                    stem: "I usually ______ (get) up at 6:30, but my brother ______ (get) up at 7:00.",
                    options: [
                        "get / get", 
                        "get / gets", 
                        "gets / get", 
                        "gets / gets"
                    ],
                    correct: 1,
                },
                {
                    id: 7,
                    stem: "Which adverb of frequency goes in the correct position?  'I ______ (always / am) tired in the morning.'",
                    options: [
                        "I always am tired", 
                        "I am always tired", 
                        "Always I am tired", 
                        "I am tired always"
                    ],
                    correct: 1,
                },
                {
                    id: 8,
                    stem: "My grandmother ______ (watch) TV in the evening, but she ______ (not / watch) the news.",
                    options: [
                        "watch / doesn't watch", 
                        "watches / don't watch", 
                        "watches / doesn't watch", 
                        "watch / don't watch"
                    ],
                    correct: 2,
                },
                {
                    id: 9,
                    stem: "______ your parents ______ (work) on Saturdays?",
                    options: [
                        "Do / work", 
                        "Does / work", 
                        "Do / works", 
                        "Does / works"
                    ],
                    correct: 0,
                },
                {
                    id: 10,
                    stem: "Choose the sentence that describes a typical daily routine:",
                    options: [
                        "I am taking a shower now.",
                        "I take a shower every morning.",
                        "I took a shower yesterday.",
                        "I will take a shower later."
                    ],
                    correct: 1,
                }
            ];

            // ----- Renderizar preguntas -----
            const container = document.getElementById('questionsContainer');
            let html = '';
            questions.forEach((q, index) => {
                const qNum = index + 1;
                html += `<div class="question" data-qid="${q.id}">`;
                html += `<div class="q-title"><span class="q-number">${qNum}</span> ${q.stem}</div>`;
                html += `<div class="options">`;
                q.options.forEach((opt, optIndex) => {
                    const nameAttr = `q${q.id}`;
                    html += `<div class="option">`;
                    html += `<input type="radio" name="${nameAttr}" value="${optIndex}" id="q${q.id}_opt${optIndex}">`;
                    html += `<label for="q${q.id}_opt${optIndex}">${opt}</label>`;
                    html += `</div>`;
                });
                html += `<div class="feedback" id="feedback_${q.id}">⚡ Selecciona una opción</div>`;
                html += `</div></div>`;
            });
            container.innerHTML = html;

            // ----- Referencias a elementos -----
            const checkBtn = document.getElementById('checkBtn');
            const resetBtn = document.getElementById('resetBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');

            // ----- Función para evaluar -----
            function evaluate() {
                let correctCount = 0;
                let total = questions.length;

                questions.forEach((q) => {
                    const selectedRadio = document.querySelector(`input[name="q${q.id}"]:checked`);
                    const feedbackEl = document.getElementById(`feedback_${q.id}`);
                    // eliminar clases previas
                    feedbackEl.classList.remove('correct-feedback', 'incorrect-feedback');

                    if (selectedRadio) {
                        const selectedValue = parseInt(selectedRadio.value);
                        if (selectedValue === q.correct) {
                            correctCount++;
                            feedbackEl.textContent = '✅ Correcto!';
                            feedbackEl.classList.add('correct-feedback');
                        } else {
                            feedbackEl.textContent = `❌ Incorrecto. Respuesta correcta: "${q.options[q.correct]}"`;
                            feedbackEl.classList.add('incorrect-feedback');
                        }
                    } else {
                        feedbackEl.textContent = '⚠️ No has seleccionado respuesta.';
                        feedbackEl.classList.remove('correct-feedback', 'incorrect-feedback');
                    }
                });

                // Actualizar puntuación
                scoreDisplay.innerHTML = `<span>🏆</span> ${correctCount} / ${total}`;
                // efecto visual extra
                if (correctCount === total) {
                    scoreDisplay.style.background = '#1f7b4d';
                } else {
                    scoreDisplay.style.background = '#142b44';
                }
            }

            // ----- Función para reiniciar (limpiar selecciones y feedbacks) -----
            function resetAll() {
                // Desmarcar todos los radios
                document.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.checked = false;
                });
                // Restablecer feedbacks
                questions.forEach((q) => {
                    const feedbackEl = document.getElementById(`feedback_${q.id}`);
                    feedbackEl.textContent = '⚡ Selecciona una opción';
                    feedbackEl.classList.remove('correct-feedback', 'incorrect-feedback');
                });
                // Restablecer score
                scoreDisplay.innerHTML = `<span>🏆</span> 0 / ${questions.length}`;
                scoreDisplay.style.background = '#142b44';
            }

            // ----- Event listeners -----
            checkBtn.addEventListener('click', evaluate);
            resetBtn.addEventListener('click', resetAll);

            // Opcional: presionar Enter para evaluar (accesibilidad)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    evaluate();
                }
            });

            // Inicializar feedbacks y score al cargar
            resetAll(); // para dejar mensajes iniciales

            // adicional: si se cambia una opción, se podría limpiar feedback (pero no obligatorio)
            // Mejora UX: al seleccionar, quitar feedback anterior
            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const qId = this.name.replace('q', '');
                    const feedbackEl = document.getElementById(`feedback_${qId}`);
                    if (feedbackEl) {
                        // solo si no ha sido evaluado aún (si tiene clases de feedback, las dejamos)
                        // pero para no confundir, no removemos inmediatamente, pero podemos indicar 'seleccionado'
                        if (!feedbackEl.classList.contains('correct-feedback') && !feedbackEl.classList.contains('incorrect-feedback')) {
                            feedbackEl.textContent = '⚡ Opción seleccionada';
                        } else {
                            // si ya fue evaluado, no cambiar el mensaje hasta que se vuelva a evaluar
                            // pero para mejorar, podemos dejar que el usuario sepa que cambió
                            // No sobreescribimos para no perder la corrección, pero si el usuario cambia, puede re-evaluar.
                            // Dejamos que el mensaje persista.
                        }
                    }
                });
            });

        })();
    </script>
</body>
</html>
